<!-- EsPlay: the wordmark drawn while the bundle loads and the app starts, until the app calls esplayHideBootSplash. -->
<div id="esplay-boot">
<style>
#esplay-boot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100000;background:#000;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-transition:opacity .45s ease;transition:opacity .45s ease}
#esplay-boot.esplay-boot-out{opacity:0}
#esplay-boot-mark{width:38%;-webkit-animation:esplayBootGrow 1.1s cubic-bezier(.2,.7,.2,1) both;animation:esplayBootGrow 1.1s cubic-bezier(.2,.7,.2,1) both}
#esplay-boot-logo{display:block;width:100%;height:auto}
#esplay-boot .ep-glyph{opacity:0;-webkit-animation:esplayBootIn .55s ease-out both;animation:esplayBootIn .55s ease-out both}
#ep-E{-webkit-animation-delay:.10s!important;animation-delay:.10s!important}
#ep-S{-webkit-animation-delay:.22s!important;animation-delay:.22s!important}
#ep-P{-webkit-animation-delay:.38s!important;animation-delay:.38s!important}
#ep-L{-webkit-animation-delay:.50s!important;animation-delay:.50s!important}
#ep-A{-webkit-animation-delay:.62s!important;animation-delay:.62s!important}
#ep-Y{-webkit-animation-delay:.74s!important;animation-delay:.74s!important}
#esplay-boot-bar{position:relative;width:22%;height:4px;margin-top:4.5%;border-radius:2px;background:#1C1C20;overflow:hidden;opacity:0;-webkit-animation:esplayBootIn .4s ease-out 1.1s both;animation:esplayBootIn .4s ease-out 1.1s both}
#esplay-boot-bar span{position:absolute;top:0;left:-40%;width:40%;height:100%;border-radius:2px;background:#E71414;-webkit-animation:esplayBootRun 1.3s ease-in-out 1.1s infinite;animation:esplayBootRun 1.3s ease-in-out 1.1s infinite}
@-webkit-keyframes esplayBootIn{from{opacity:0}to{opacity:1}}
@keyframes esplayBootIn{from{opacity:0}to{opacity:1}}
@-webkit-keyframes esplayBootGrow{from{-webkit-transform:scale(.86);opacity:0}to{-webkit-transform:scale(1);opacity:1}}
@keyframes esplayBootGrow{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
@-webkit-keyframes esplayBootRun{from{left:-40%}to{left:100%}}
@keyframes esplayBootRun{from{left:-40%}to{left:100%}}
</style>

<script>
(function() {
	var shownAt = Date.now();
	var MIN_MS = 1900;
	var done = false;
	window.esplayHideBootSplash = function() {
		if (done) return;
		done = true;
		setTimeout(function() {
			var el = document.getElementById('esplay-boot');
			if (!el) return;
			el.className = 'esplay-boot-out';
			setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
		}, Math.max(0, MIN_MS - (Date.now() - shownAt)));
	};
	// Never left over the app if it fails to start.
	setTimeout(window.esplayHideBootSplash, 20000);
})();
</script>
